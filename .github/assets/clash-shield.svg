  <title id="logo-title">Clash Shield — gold and crimson bot emblem</title>
  <desc id="logo-description">Symmetric shield with a shallow crest, faceted gold frame, brown and crimson panels, charcoal visor, and two gold eyes. All artwork is editable vector geometry; no embedded images, fonts, filters, or external resources. Light falls from the upper left.</desc>
