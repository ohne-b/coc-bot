name: Bug report
description: Report a reproducible problem.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Redact credentials, API keys, player identifiers, logs and screenshots. Report vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, LDPlayer version, resolution, DPI and game language.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Share only the minimum evidence needed; do not attach your personal config.
