name: validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: legacy/python/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD
      - name: Install baseline test dependencies
        run: python -m pip install -r legacy/python/requirements.txt
      - name: Test repository automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/check_pr_title.py
      - name: Test Python baseline offline
        working-directory: legacy/python
        run: python -m unittest discover -v
      - name: Check inherited dashboard JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem legacy/python/web -Filter *.js | ForEach-Object {
            Get-Content -Raw -Encoding UTF8 $_.FullName | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $_" }
          }
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust recognition offline
        shell: pwsh
        run: |
          . ./scripts/windows-dependencies.ps1
          cargo test --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
