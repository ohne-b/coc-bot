name: validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: legacy/python/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD
      - name: Install baseline test dependencies
        run: python -m pip install -r legacy/python/requirements.txt
      - name: Test repository automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: Test release metadata and artifact integrity
        run: node --test .github/scripts/release.test.mjs
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/check_pr_title.py
      - name: Test Python baseline offline
        working-directory: legacy/python
        run: python -m unittest discover -v
      - name: Check inherited dashboard JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem legacy/python/web -Filter *.js | ForEach-Object {
            Get-Content -Raw -Encoding UTF8 $_.FullName | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $_" }
          }
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend
        shell: pwsh
        run: |
          npm --prefix frontend run format:check
          if ($LASTEXITCODE -ne 0) { throw 'Frontend formatting failed' }
          npm --prefix frontend test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend typecheck or build failed' }
      - name: Test dashboard controls and accessibility offline
        shell: pwsh
        run: |
          npm exec --prefix frontend -- playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          npm --prefix frontend run test:browser
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard tests failed' }
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust core and desktop offline
        shell: pwsh
        run: |
          . ./scripts/windows-dependencies.ps1
          cargo test --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo build -p coc-bot-desktop --features desktop-fixture,custom-protocol --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop fixture build failed' }
      - name: Build Windows installer from validated main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Retain exact Windows release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 30
