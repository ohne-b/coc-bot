name: validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD
      - name: Prepare signature verifier
        run: ./.github/scripts/windows-signing.ps1
      - name: Test repository automation
        run: node --test .github/scripts/*.test.mjs
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/check-pr-title.mjs
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend
        shell: pwsh
        run: |
          npm --prefix frontend run format:check
          if ($LASTEXITCODE -ne 0) { throw 'Frontend formatting failed' }
          npm --prefix frontend test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend typecheck or build failed' }
      - name: Test dashboard controls and accessibility offline
        shell: pwsh
        run: |
          npm exec --prefix frontend -- playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          npm --prefix frontend run test:browser
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard tests failed' }
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust core and desktop offline
        shell: pwsh
        run: |
          . ./.github/scripts/windows-dependencies.ps1
          cargo test --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo build -p coc-bot-desktop --features desktop-fixture,custom-protocol --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop fixture build failed' }
      - name: Build Windows installer from validated main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./.github/scripts/build-windows.ps1
      - name: Check installed native dependencies and uninstallation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/windows -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one staged installer' }
          ./.github/scripts/test-windows-install.ps1 -Installer $installers[0].FullName
      - name: Retain exact Windows release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 30
